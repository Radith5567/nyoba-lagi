<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Selamat Ulang Tahun!</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- Floating Background Elements -->
  <div class="balloon-container" id="balloonContainer"></div>

  <div class="card-container">
    <div class="card">
      <div class="header">
        <span class="badge">Special Day ✨</span>
        <h1 class="title">Happy Birthday! 🥳</h1>
      </div>

      <!-- Interactive Cake -->
      <div class="cake-wrapper">
        <div class="cake">
          <div class="candle">
            <div class="flame" id="flame"></div>
          </div>
          <div class="top-layer"></div>
          <div class="middle-layer"></div>
          <div class="bottom-layer"></div>
        </div>
      </div>

      <!-- Wish Message -->
      <div class="message-box">
        <p id="greetingText">
          Selamat merayakan hari spesialmu! Semoga di usia yang baru ini senantiasa dipenuhi kebahagiaan, kesehatan, keberhasilan, dan keberkahan dalam setiap langkah. 🌟
        </p>
      </div>

      <!-- Action Buttons -->
      <div class="btn-group">
        <button class="btn btn-primary" onclick="blowCandle()">🎂 Tiup Lilin</button>
        <button class="btn btn-secondary" onclick="triggerConfetti()">🎉 Rayakan!</button>
      </div>

      <!-- KOTAK-KOTAK INTERAKTIF -->
      <div class="interactive-section">
        <h3 class="section-title">Buka Kotak Kejutan 🎁</h3>
        <div class="grid-boxes">
          <div class="box" onclick="openBox(this, 'Kamu adalah sosok yang selalu membawa keceriaan! 💖')">
            <span class="box-icon">🎁</span>
            <span class="box-label">Klik Aku</span>
          </div>
          <div class="box" onclick="openBox(this, 'Semoga semua cita-cita dan impian besarmu segera terwujud! ✨')">
            <span class="box-icon">🎁</span>
            <span class="box-label">Klik Aku</span>
          </div>
          <div class="box" onclick="openBox(this, 'Terima kasih telah menjadi orang yang luar biasa! 🌸')">
            <span class="box-icon">🎁</span>
            <span class="box-label">Klik Aku</span>
          </div>
          <div class="box" onclick="openBox(this, 'Tetaplah bersinar dan bahagia setiap harinya! 🌟')">
            <span class="box-icon">🎁</span>
            <span class="box-label">Klik Aku</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
